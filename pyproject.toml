[project]
name = "ti36x-emulator"
version = "0.1.0"
description = "TI-36X Pro calculator emulator with HTTP API and MCP server"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sympy>=1.12",
    "pydantic>=2.5",
    "mcp>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ti36x*"]
